<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>倒计时</title>
  <link rel="preload" href="./fonts/cormorant-garamond.woff2?v=5d618c46" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/noto-serif-sc.woff2?v=dd18346c" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./styles/main.css?v=80433014" />
  <!-- 资源版本号由 tools/version-assets.mjs 生成，勿手改 -->
  <script type="importmap">
  {
    "imports": {
      "./config/app.js": "./config/app.js?v=e7dd3721",
      "./config/events.js": "./config/events.js?v=d9aa8654",
      "./config/themes.js": "./config/themes.js?v=c8b27363",
      "./scripts/app.js": "./scripts/app.js?v=d55dcbff",
      "./scripts/countdown.js": "./scripts/countdown.js?v=09c1b7aa",
      "./scripts/dom.js": "./scripts/dom.js?v=f35d43b0",
      "./scripts/footer.js": "./scripts/footer.js?v=6d0db4e4",
      "./scripts/holidays.js": "./scripts/holidays.js?v=3b107918",
      "./scripts/theme.js": "./scripts/theme.js?v=aac6b793",
      "./utils/time.js": "./utils/time.js?v=ca88976b"
    }
  }
  </script>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>

  <div class="page">
    <nav class="themes" id="themes" aria-label="主题"></nav>

    <!-- 手机版：右侧竖向进度 -->
    <div class="vprogress" role="progressbar" aria-label="进度" aria-valuemin="0" aria-valuemax="100">
      <div class="vprogress-fill" id="vfill"></div>
      <div class="vprogress-dot" id="vdot"></div>
      <div class="vprogress-pct" id="vpct"></div>
      <div class="vprogress-label" aria-hidden="true">进度</div>
    </div>

    <main class="hero">
      <h1 class="headline" aria-live="polite">
        <span class="headline-aside" id="hlPre"></span>
        <span class="headline-name" id="hlName">--</span>
        <span class="headline-aside" id="hlPost"></span>
      </h1>

      <div class="clock" id="clock">
        <span class="clock-days" id="days">-</span>
        <span class="clock-side">
          <span class="clock-unit">天</span>
          <span class="clock-hms" id="hms">--:--:--</span>
        </span>
      </div>

      <div class="info">
        <span class="range"><span id="rangeFrom"></span><span class="range-to" id="rangeTo"></span></span><span class="range-total" id="rangeTotal"></span>
        <span class="info-progress" id="progTextM"></span>
      </div>

      <!-- 桌面版：横向进度 -->
      <div class="progress">
        <div class="progress-track" id="progress" role="progressbar" aria-label="进度" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="fill"></div>
        </div>
        <div class="progress-meta">
          <span id="progText"></span>
          <span id="progPct"></span>
        </div>
      </div>
    </main>

    <footer class="foot">
      <div class="foot-item" id="footNext">
        <span class="foot-label">之后</span>
        <span class="foot-text"><span class="foot-value" id="nextText">--</span><span class="foot-when" id="nextWhen"></span></span>
      </div>
      <div class="foot-item" id="footSun">
        <span class="foot-label">下个周日</span>
        <span class="foot-text"><span class="foot-value" id="sunText">--</span><span class="foot-when" id="sunWhen"></span></span>
      </div>
    </footer>
  </div>

  <script type="module" src="./scripts/app.js?v=d55dcbff"></script>
</body>
</html>
